<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="app-container">

        <header class="header">
            <h1>
                <i class="fas fa-wallet"></i>
                Expense Tracker
            </h1>
        </header>

        <section class="summary-cards">

            <div class="card">
                <div class="card-label">
                    <i class="fas fa-arrow-down"></i>
                    Income
                </div>
                <div class="card-value income" id="totalIncome">₹0.00</div>
            </div>

            <div class="card">
                <div class="card-label">
                    <i class="fas fa-arrow-up"></i>
                    Expenses
                </div>
                <div class="card-value expense" id="totalExpense">₹0.00</div>
            </div>

            <div class="card">
                <div class="card-label">
                    <i class="fas fa-scale-balanced"></i>
                    Balance
                </div>
                <div class="card-value" id="totalBalance">₹0.00</div>
            </div>

        </section>

        <section class="form-section">

            <div class="form-title">
                <i class="fas fa-pen"></i>
                <span id="formTitle">Add transaction</span>
            </div>

            <form id="transactionForm">

                <div class="form-grid">

                    <div class="input-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="input-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g. Groceries" maxlength="100" required>
                    </div>

                    <div class="input-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select</option>
                            <option value="Salary">Salary</option>
                            <option value="Freelance">Freelance</option>
                            <option value="Investment">Investment</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Housing">Housing</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>

                    <div class="input-group">
                        <label for="type">Type</label>
                        <select id="type" required>
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-plus-circle"></i>
                        <span id="submitBtnText">Add</span>
                    </button>

                </div>

            </form>

            <div class="cancel-wrapper">
                <button class="btn btn-outline" id="cancelEditBtn" type="button">
                    <i class="fas fa-times"></i>
                    Cancel edit
                </button>
            </div>

        </section>

        <section class="filter-row">

            <div class="filter-group">

                <label for="filterCategory">
                    <i class="fas fa-filter"></i>
                    Filter by category
                </label>

                <select id="filterCategory">
                    <option value="all">All categories</option>
                    <option value="Salary">Salary</option>
                    <option value="Freelance">Freelance</option>
                    <option value="Investment">Investment</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Housing">Housing</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Other">Other</option>
                </select>

                <span class="badge" id="filterBadge">All</span>

            </div>

            <button class="btn btn-outline" id="clearAllBtn" type="button">
                <i class="fas fa-trash-alt"></i>
                Clear all
            </button>

        </section>

        <section class="transactions-container">

            <div class="table-header">
                <div>Date</div>
                <div>Description</div>
                <div>Category</div>
                <div class="amount-header">Amount</div>
                <div>Type</div>
                <div class="actions-header">Actions</div>
            </div>

            <div id="transactionsList"></div>

        </section>

    </div>


</body>

</html>
